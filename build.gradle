plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "CurseMaven"
		url = "https://www.cursemaven.com"
		content { includeGroup "curse.maven" }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"madoku-craft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Feature repositories are checked out below modules/<name>. The bundle project
// compiles their matching source roots into the existing unified mod jar.
def madokuModuleNames = [
	"core",
	"attributes",
	"items",
	"farming",
	"ecosystem",
	"levels",
	"mobs",
	"pets",
	"utility",
	"hud",
	"compat"
]

def madokuModuleRoots = madokuModuleNames
	.collect { file("modules/${it}") }
	.findAll { it.isDirectory() }

def madokuModuleSourceDirs = { String sourceRoot ->
	madokuModuleRoots.collect { new File(it, "src/main/${sourceRoot}") }
}

def madokuModuleResourceDirs = madokuModuleRoots.collect {
	new File(it, "src/main/resources")
}

sourceSets {
	main {
		java {
			srcDirs = ["src/main/server"] + madokuModuleSourceDirs("server")
		}
		resources {
			srcDirs = ["src/main/resources"] + madokuModuleResourceDirs
			exclude { details ->
				String path = details.file.absolutePath.replace('\\', '/')
				path.contains('/modules/') && details.path in [
					'fabric.mod.json',
					'assets/madoku-craft/lang/en_us.json'
				]
			}
		}
	}
	client {
		java {
			srcDirs = ["src/main/client"] + madokuModuleSourceDirs("client")
		}
	}
}

tasks.register("validateMadokuModuleBoundaries") {
	group = "verification"
	description = "Validates the modular source layout and Core dependency boundary."

	doLast {
		def errors = []
		madokuModuleNames.each { String moduleName ->
			File moduleRoot = file("modules/${moduleName}")
			if (!moduleRoot.isDirectory()) {
				errors << "Missing declared module directory: modules/${moduleName}"
				return
			}

			["build.gradle", "settings.gradle", "gradle.properties"].each { String metadataFile ->
				if (!new File(moduleRoot, metadataFile).isFile()) {
					errors << "Missing ${metadataFile}: modules/${moduleName}/${metadataFile}"
				}
			}
			if (!new File(moduleRoot, "src/main/resources/fabric.mod.json").isFile()) {
				errors << "Missing Fabric metadata: modules/${moduleName}/src/main/resources/fabric.mod.json"
			}

			if (moduleName != "core") {
				String buildText = new File(moduleRoot, "build.gradle").text
				String settingsText = new File(moduleRoot, "settings.gradle").text
				if (!buildText.contains("madoku-craft-core")) {
					errors << "Module ${moduleName} must declare a Core dependency."
				}
				if (!settingsText.contains('includeBuild("../core")')) {
					errors << "Module ${moduleName} must include the sibling Core build."
				}
			}
		}

		def allowedRootSources = [
			"src/main/server/madoku/craft/java/MadokuCraft.java",
			"src/main/client/madoku/craft/java/MadokuCraftClient.java"
		].collect { file(it).canonicalPath }
		fileTree("src/main").matching { include "**/*.java" }.files.each { File sourceFile ->
			if (!allowedRootSources.contains(sourceFile.canonicalPath)) {
				errors << "Root source must remain an aggregate-only entrypoint: ${sourceFile}"
			}
		}

		File compatManifestFile = file("modules/compat/src/main/resources/fabric.mod.json")
		if (compatManifestFile.isFile()) {
			def compatManifest = new groovy.json.JsonSlurper().parse(compatManifestFile)
			[
				"madoku-craft-attributes",
				"madoku-craft-levels",
				"madoku-craft-farming",
				"madoku-craft-mobs",
				"madoku-craft-pets",
				"madoku-craft-items",
				"madoku-craft-hud"
			].each { String featureId ->
				if (compatManifest.depends?.containsKey(featureId)) {
					errors << "Compat must not require feature module ${featureId}; use optional detection instead."
				}
			}
		}

		File hudBuildFile = file("modules/hud/build.gradle")
		if (hudBuildFile.isFile() && hudBuildFile.text.contains("madoku-craft-attributes")) {
			errors << "HUD must not declare a direct Attributes Gradle dependency; use Compat for the optional bridge."
		}
		File hudManifestFile = file("modules/hud/src/main/resources/fabric.mod.json")
		if (hudManifestFile.isFile()) {
			def hudManifest = new groovy.json.JsonSlurper().parse(hudManifestFile)
			if (hudManifest.depends?.containsKey("madoku-craft-attributes")) {
				errors << "HUD must not require the Attributes module; use Compat for the optional bridge."
			}
		}
		fileTree("modules/hud/src/main").matching { include "**/*.java" }.files.each { File sourceFile ->
			sourceFile.eachLine { String line, int lineNumber ->
				if (line ==~ /^\s*import\s+madoku\.craft\.java\.attributes\./) {
					errors << "HUD must not import Attributes APIs at ${sourceFile}: ${lineNumber}: ${line.trim()}"
				}
			}
		}

		File utilityBuildFile = file("modules/utility/build.gradle")
		if (utilityBuildFile.isFile() && utilityBuildFile.text.contains("madoku-craft-items")) {
			errors << "Utility must not declare a direct Items Gradle dependency; use Compat for the optional bridge."
		}
		File utilityManifestFile = file("modules/utility/src/main/resources/fabric.mod.json")
		if (utilityManifestFile.isFile()) {
			def utilityManifest = new groovy.json.JsonSlurper().parse(utilityManifestFile)
			if (utilityManifest.depends?.containsKey("madoku-craft-items")) {
				errors << "Utility must not require the Items module; use Compat for the optional bridge."
			}
		}
		fileTree("modules/utility/src/main").matching { include "**/*.java" }.files.each { File sourceFile ->
			sourceFile.eachLine { String line, int lineNumber ->
				if (line ==~ /^\s*import\s+madoku\.craft\.java\.items\./) {
					errors << "Utility must not import Items APIs at ${sourceFile}: ${lineNumber}: ${line.trim()}"
				}
			}
		}

		def forbiddenCoreImport = ~/^\s*import\s+madoku\.craft\.java\.(attributes|items|farming|ecosystem|levels|mob|pet|hud|compat|entity|utility)\./
		fileTree("modules/core/src/main").matching { include "**/*.java" }.files.each { File sourceFile ->
			sourceFile.eachLine { String line, int lineNumber ->
				if (line ==~ forbiddenCoreImport) {
					errors << "Core imports a feature package at ${sourceFile}: ${lineNumber}: ${line.trim()}"
				}
			}
		}

		if (!errors.isEmpty()) {
			throw new GradleException("Madoku module boundary validation failed:\n - " + errors.join("\n - "))
		}
	}
}

		tasks.named("check") {
	dependsOn("validateMadokuModuleBoundaries")
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional client-side integrations, following the original Madoku Craft
	// development dependency pattern. These are not Fabric manifest requirements.
	implementation "curse.maven:sodium-394468:${project.sodium_id}"
	implementation "curse.maven:irisshaders-455508:${project.iris_id}"

}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version
	inputs.property "fabric_api_version", project.fabric_api_version
	inputs.property "sodium_version", project.sodium_version
	inputs.property "iris_version", project.iris_version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version,
			"minecraft_version": inputs.properties.minecraft_version,
			"loader_version": inputs.properties.loader_version,
			"fabric_api_version": inputs.properties.fabric_api_version,
			"sodium_version": inputs.properties.sodium_version,
			"iris_version": inputs.properties.iris_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
